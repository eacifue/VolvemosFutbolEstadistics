name: app_mobile
description: A Flutter app replicating the React football stats app.

publish_to: 'none'

version: 1.0.0+1

environment:
  # vaf_tokens.dart usa CardThemeData/DialogThemeData/TabBarThemeData: Flutter ≥ 3.29 (Dart 3.7)
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  dio: ^5.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  # Rediseño "Clásico de barrio": Barlow Condensed para números y titulares, Manrope para texto (OFL, ver assets/fonts).
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf