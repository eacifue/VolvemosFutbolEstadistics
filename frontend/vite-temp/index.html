<!DOCTYPE html>
<html lang="es-CO" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Volvemos al Fútbol · Blanco y Negro</title>
    <meta name="description" content="Las estadísticas del Blanco vs Negro: resultados, ranking, perfiles y la rivalidad de siempre." />
    <link rel="icon" type="image/svg+xml" href="/escudo.svg" />
    <link rel="apple-touch-icon" href="/escudo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0c" />
    <script>
      try {
        var t = localStorage.getItem('vf_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
